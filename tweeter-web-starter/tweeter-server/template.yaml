AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Tweeter web API

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Timeout: 10
    MemorySize: 128

Resources:
  TweeterApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: TweeterApi
      StageName: dev
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterRegister
      CodeUri: build/RegisterFunction
      Handler: index.handler
      Events:
        RegisterPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /auth/register
            Method: post

  RegisterDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /auth/register
        Method: POST
      Properties: '{"description":"Register a user. Returns the user and an authentication token."}'

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterLogin
      CodeUri: build/LoginFunction
      Handler: index.handler
      Events:
        LoginPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /auth/login
            Method: post

  LoginDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /auth/login
        Method: POST
      Properties: '{"description":"Sign in a user. Returns the user and an authentication token."}'

  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterLogout
      CodeUri: build/LogoutFunction
      Handler: index.handler
      Events:
        LogoutPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /auth/logout
            Method: post

  LogoutDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /auth/logout
        Method: POST
      Properties: '{"description":"Sign out the user identified by the authentication token in the request body."}'

  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterGetUser
      CodeUri: build/GetUserFunction
      Handler: index.handler
      Events:
        GetUserPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /user/get
            Method: post

  GetUserDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /user/get
        Method: POST
      Properties: '{"description":"Return the user for an alias. The authentication token is included in the request body."}'

  PostStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterPostStatus
      CodeUri: build/PostStatusFunction
      Handler: index.handler
      Events:
        PostStatusPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /status/post
            Method: post

  PostStatusDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /status/post
        Method: POST
      Properties: '{"description":"Post a status for the authenticated user. The status is included in the request body."}'

  StoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterStory
      CodeUri: build/StoryFunction
      Handler: index.handler
      Events:
        StoryPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /status/story
            Method: post

  StoryDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /status/story
        Method: POST
      Properties: '{"description":"Return one page of a user story. Send the last status from the previous page, or null for the first page."}'

  FeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterFeed
      CodeUri: build/FeedFunction
      Handler: index.handler
      Events:
        FeedPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /status/feed
            Method: post

  FeedDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /status/feed
        Method: POST
      Properties: '{"description":"Return one page of a user feed. Send the last status from the previous page, or null for the first page."}'

Outputs:
  ApiUrl:
    Description: Base URL. Paste this into ServerFacade, with no trailing slash.
    Value: !Sub "https://${TweeterApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
