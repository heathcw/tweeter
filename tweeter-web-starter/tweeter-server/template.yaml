AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Tweeter web API

Parameters:
  TableReadCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 25
    Description: Provisioned read capacity for each table and index.
  TableWriteCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 25
    Description: Provisioned write capacity for each table and index.
  FeedWriteCapacity:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 25
    Description: Feed writes fan out, so this can be raised temporarily for passoff.

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        USERS_TABLE_NAME: !Ref UsersTable
        AUTH_TOKENS_TABLE_NAME: !Ref AuthTokensTable
        FOLLOWS_TABLE_NAME: !Ref FollowsTable
        STORIES_TABLE_NAME: !Ref StoriesTable
        FEEDS_TABLE_NAME: !Ref FeedsTable
        FOLLOWEE_INDEX_NAME: followee-index
        PROFILE_IMAGES_BUCKET_NAME: !Ref ProfileImagesBucket
        TOKEN_INACTIVITY_MINUTES: "10"

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: alias
          AttributeType: S
      KeySchema:
        - AttributeName: alias
          KeyType: HASH
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: !Ref TableReadCapacity
        WriteCapacityUnits: !Ref TableWriteCapacity
      SSESpecification:
        SSEEnabled: true

  AuthTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: !Ref TableReadCapacity
        WriteCapacityUnits: !Ref TableWriteCapacity
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: cleanupAt
        Enabled: true

  FollowsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: followerAlias
          AttributeType: S
        - AttributeName: followeeAlias
          AttributeType: S
      KeySchema:
        - AttributeName: followerAlias
          KeyType: HASH
        - AttributeName: followeeAlias
          KeyType: RANGE
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: !Ref TableReadCapacity
        WriteCapacityUnits: !Ref TableWriteCapacity
      GlobalSecondaryIndexes:
        - IndexName: followee-index
          KeySchema:
            - AttributeName: followeeAlias
              KeyType: HASH
            - AttributeName: followerAlias
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
          ProvisionedThroughput:
            ReadCapacityUnits: !Ref TableReadCapacity
            WriteCapacityUnits: !Ref TableWriteCapacity
      SSESpecification:
        SSEEnabled: true

  StoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: authorAlias
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: authorAlias
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: !Ref TableReadCapacity
        WriteCapacityUnits: !Ref TableWriteCapacity
      SSESpecification:
        SSEEnabled: true

  FeedsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: ownerAlias
          AttributeType: S
        - AttributeName: feedSortKey
          AttributeType: S
      KeySchema:
        - AttributeName: ownerAlias
          KeyType: HASH
        - AttributeName: feedSortKey
          KeyType: RANGE
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: !Ref TableReadCapacity
        WriteCapacityUnits: !Ref FeedWriteCapacity
      SSESpecification:
        SSEEnabled: true

  ProfileImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "tweeter-profile-images-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  ProfileImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProfileImagesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadProfileImages
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${ProfileImagesBucket.Arn}/image/*"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ProfileImagesBucket.Arn
              - !Sub "${ProfileImagesBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  TweeterApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: TweeterApi
      StageName: dev
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterRegister
      CodeUri: build/RegisterFunction
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthTokensTable
        - S3CrudPolicy:
            BucketName: !Ref ProfileImagesBucket
      Events:
        RegisterPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /auth/register
            Method: post

  RegisterDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /auth/register
        Method: POST
      Properties: '{"description":"Register a user. Returns the user and an authentication token."}'

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterLogin
      CodeUri: build/LoginFunction
      Handler: index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthTokensTable
      Events:
        LoginPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /auth/login
            Method: post

  LoginDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /auth/login
        Method: POST
      Properties: '{"description":"Sign in a user. Returns the user and an authentication token."}'

  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterLogout
      CodeUri: build/LogoutFunction
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthTokensTable
      Events:
        LogoutPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /auth/logout
            Method: post

  LogoutDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /auth/logout
        Method: POST
      Properties: '{"description":"Sign out the user identified by the authentication token in the request body."}'

  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterGetUser
      CodeUri: build/GetUserFunction
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthTokensTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        GetUserPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /user/get
            Method: post

  GetUserDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /user/get
        Method: POST
      Properties: '{"description":"Return the user for an alias. The authentication token is included in the request body."}'

  PostStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterPostStatus
      CodeUri: build/PostStatusFunction
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthTokensTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StoriesTable
        - DynamoDBReadPolicy:
            TableName: !Ref FollowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedsTable
      Events:
        PostStatusPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /status/post
            Method: post

  PostStatusDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /status/post
        Method: POST
      Properties: '{"description":"Post a status for the authenticated user. The status is included in the request body."}'

  StoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterStory
      CodeUri: build/StoryFunction
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthTokensTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref StoriesTable
      Events:
        StoryPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /status/story
            Method: post

  StoryDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /status/story
        Method: POST
      Properties: '{"description":"Return one page of a user story. Send the last status from the previous page, or null for the first page."}'

  FeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterFeed
      CodeUri: build/FeedFunction
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthTokensTable
        - DynamoDBReadPolicy:
            TableName: !Ref FeedsTable
      Events:
        FeedPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /status/feed
            Method: post

  FeedDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /status/feed
        Method: POST
      Properties: '{"description":"Return one page of a user feed. Send the last status from the previous page, or null for the first page."}'

  FollowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterFollow
      CodeUri: build/FollowFunction
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthTokensTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FollowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        FollowPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /follow
            Method: post

  FollowDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /follow
        Method: POST
      Properties: '{"description":"Follow a user. Returns that user follower count and followee count."}'

  UnfollowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterUnfollow
      CodeUri: build/UnfollowFunction
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthTokensTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FollowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        UnfollowPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /unfollow
            Method: post

  UnfollowDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /unfollow
        Method: POST
      Properties: '{"description":"Unfollow a user. Returns that user follower count and followee count."}'

  IsFollowerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterIsFollower
      CodeUri: build/IsFollowerFunction
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthTokensTable
        - DynamoDBReadPolicy:
            TableName: !Ref FollowsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        IsFollowerPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /follow/isFollower
            Method: post

  IsFollowerDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /follow/isFollower
        Method: POST
      Properties: '{"description":"Report whether the user is a follower of the selected user. The authentication token is in the request body."}'

  FollowerCountFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterFollowerCount
      CodeUri: build/FollowerCountFunction
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthTokensTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        FollowerCountPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /follower/count
            Method: post

  FollowerCountDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /follower/count
        Method: POST
      Properties: '{"description":"Return the follower count for a user."}'

  FolloweeCountFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterFolloweeCount
      CodeUri: build/FolloweeCountFunction
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthTokensTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        FolloweeCountPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /followee/count
            Method: post

  FolloweeCountDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /followee/count
        Method: POST
      Properties: '{"description":"Return the followee count for a user."}'

  FollowerListFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterFollowerList
      CodeUri: build/FollowerListFunction
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthTokensTable
        - DynamoDBReadPolicy:
            TableName: !Ref FollowsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        FollowerListPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /follower/list
            Method: post

  FollowerListDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /follower/list
        Method: POST
      Properties: '{"description":"Return one page of followers. Send the last user from the previous page, or null for the first page."}'

  FolloweeListFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TweeterFolloweeList
      CodeUri: build/FolloweeListFunction
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthTokensTable
        - DynamoDBReadPolicy:
            TableName: !Ref FollowsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        FolloweeListPost:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /followee/list
            Method: post

  FolloweeListDocumentation:
    Type: AWS::ApiGateway::DocumentationPart
    DependsOn: TweeterApi
    Properties:
      RestApiId: !Ref TweeterApi
      Location:
        Type: METHOD
        Path: /followee/list
        Method: POST
      Properties: '{"description":"Return one page of followees. Send the last user from the previous page, or null for the first page."}'

Outputs:
  ApiUrl:
    Description: Base URL. Paste this into ServerFacade, with no trailing slash.
    Value: !Sub "https://${TweeterApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
  UsersTableName:
    Description: DynamoDB users table.
    Value: !Ref UsersTable
  AuthTokensTableName:
    Description: DynamoDB authentication tokens table.
    Value: !Ref AuthTokensTable
  FollowsTableName:
    Description: DynamoDB follow relationships table.
    Value: !Ref FollowsTable
  StoriesTableName:
    Description: DynamoDB user stories table.
    Value: !Ref StoriesTable
  FeedsTableName:
    Description: DynamoDB precomputed feeds table.
    Value: !Ref FeedsTable
  ProfileImagesBucketName:
    Description: S3 bucket containing public profile images.
    Value: !Ref ProfileImagesBucket
